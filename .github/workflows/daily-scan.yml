name: Daily MACD Stock Scan

on:
  schedule:
    # 每天 UTC 12:00 = 台灣時間 (UTC+8) 晚上 8:00
    - cron: "0 12 * * *"
  # 也允許在 GitHub 網頁上手動點擊執行 (Actions -> Daily MACD Stock Scan -> Run workflow)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
        run: python scan_stocks.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --quiet --cached || git commit -m "Daily scan results $(date -u +'%Y-%m-%d')"
          git push
