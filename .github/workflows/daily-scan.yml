name: Daily Stock Scans
 
on:
  schedule:
    # 實測發現：原本設定 UTC 11:47（台灣 19:47）觸發，但 GitHub 那個時段
    # 排隊塞車很嚴重，實際大概晚了 3 小時 40 分鐘才真的開始跑（觀察到
    # 2026-08-30 那次是台灣時間 23:28 才開始）。
    # 為了讓「實際跑起來」的時間還是落在台灣晚上 8 點左右，這裡把觸發時間
    # 往前提早了差不多 3 小時 40 分鐘，改成 UTC 08:06（台灣時間 16:06）觸發。
    # 如果之後發現延遲的幅度有變化，再依照實際觀察到的延遲量微調這個時間即可。
    - cron: "6 8 * * *"
  # 也允許在 GitHub 網頁上手動點擊執行 (Actions -> Daily Stock Scans -> Run workflow)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  macd-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
        run: python scan_stocks.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --quiet --cached || git commit -m "MACD scan results $(date -u +'%Y-%m-%d')"
          # momentum-scan 這個 job 也會同時在推送結果，用 rebase 重試避免衝突
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "推送失敗，5 秒後重試 ($i/5)..."
            sleep 5
          done

  momentum-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
        run: python momentum_scan.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --quiet --cached || git commit -m "Momentum scan results $(date -u +'%Y-%m-%d')"
          # macd-scan 這個 job 也會同時在推送結果，用 rebase 重試避免衝突
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "推送失敗，5 秒後重試 ($i/5)..."
            sleep 5
          done

  combine-results:
    needs: [macd-scan, momentum-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Combine MACD + Momentum results into one Excel
        run: python combine_results.py

      - name: Commit and push combined results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --quiet --cached || git commit -m "Combined scan results $(date -u +'%Y-%m-%d')"
          # 跟前兩個 job 一樣，用 rebase 重試避免跟其他同時發生的推送衝突
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "推送失敗，5 秒後重試 ($i/5)..."
            sleep 5
          done
